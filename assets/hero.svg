<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kerim Aydemir</title>
  <desc id="desc">A minimal animated profile signature.</desc>
  <style>
    .grain { opacity: .17; }
    .name { letter-spacing: 0; }
    .trace { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.2s ease forwards .35s; }
    .slow-trace { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 3.8s ease forwards 1.2s; }
    .glint { animation: glint 6s ease-in-out infinite; mix-blend-mode: screen; }
    .rise { opacity: 1; animation: rise 1.4s ease both; }
    .d1 { animation-delay: .35s; }
    .d2 { animation-delay: .65s; }
    .d3 { animation-delay: .95s; }
    .d4 { animation-delay: 1.25s; }
    .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .ticker { animation: ticker 18s linear infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes glint {
      0%, 18% { transform: translateX(-560px) skewX(-16deg); opacity: 0; }
      30% { opacity: .82; }
      48%, 100% { transform: translateX(1180px) skewX(-16deg); opacity: 0; }
    }
    @keyframes rise {
      from { transform: translateY(10px); }
      to { transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; transform: scale(.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-620px); }
    }
  </style>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset=".54" stop-color="#101010"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="metal" x1="170" y1="162" x2="930" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4E7C5"/>
      <stop offset=".28" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#BFA46A"/>
      <stop offset=".8" stop-color="#EDE3C5"/>
      <stop offset="1" stop-color="#8E7843"/>
    </linearGradient>
    <linearGradient id="hairline" x1="84" y1="372" x2="1114" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFA46A" stop-opacity="0"/>
      <stop offset=".18" stop-color="#BFA46A"/>
      <stop offset=".52" stop-color="#F4E7C5"/>
      <stop offset=".84" stop-color="#BFA46A"/>
      <stop offset="1" stop-color="#BFA46A" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .28"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="tickerClip">
      <rect x="88" y="430" width="1024" height="38"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" rx="0" fill="url(#ink)"/>
  <rect class="grain" width="1200" height="520" filter="url(#noise)"/>
  <path class="trace" d="M86 128C214 68 321 92 426 118C543 147 670 171 812 119C914 82 1021 72 1113 111" stroke="url(#hairline)" stroke-width="1.6" fill="none" opacity=".7"/>
  <path class="slow-trace" d="M164 382C309 410 450 407 596 382C765 354 913 349 1040 382" stroke="url(#hairline)" stroke-width="1.4" fill="none" opacity=".64"/>
  <rect class="glint" x="-190" y="0" width="120" height="520" fill="#FFF8DF" opacity=".0"/>

  <g class="rise d1" filter="url(#goldGlow)">
    <text class="name" x="600" y="202" text-anchor="middle" textLength="430" lengthAdjust="spacingAndGlyphs" fill="url(#metal)" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="800">KERIM</text>
    <text class="name" x="600" y="292" text-anchor="middle" textLength="650" lengthAdjust="spacingAndGlyphs" fill="url(#metal)" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="800">AYDEMIR</text>
  </g>

  <g class="rise d2">
    <text x="600" y="348" text-anchor="middle" fill="#C8C0AA" font-family="Inter, Arial, sans-serif" font-size="23">quiet tools for law, memory and leverage</text>
  </g>

  <g class="rise d3" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#807761">
    <text x="434" y="394" text-anchor="middle">MIRON</text>
    <text x="600" y="394" text-anchor="middle">MEMENTO</text>
    <text x="780" y="394" text-anchor="middle">SYSTEMS</text>
  </g>

  <g class="rise d4">
    <circle class="pulse" cx="1065" cy="238" r="43" stroke="#BFA46A" stroke-opacity=".42"/>
    <circle class="pulse" cx="1065" cy="238" r="7" fill="#F4E7C5"/>
    <path d="M1018 238H1112M1065 191V285" stroke="#BFA46A" stroke-opacity=".32"/>
  </g>

  <g opacity=".48" clip-path="url(#tickerClip)">
    <g class="ticker" transform="translate(88 450)" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#8F866E">
      <text x="0" y="0">SIC PARVIS MAGNA  /  MAKE IT USEFUL  /  MAKE IT CLEAR  /  MAKE IT LAST  /  </text>
      <text x="620" y="0">SIC PARVIS MAGNA  /  MAKE IT USEFUL  /  MAKE IT CLEAR  /  MAKE IT LAST  /  </text>
    </g>
  </g>
</svg>
