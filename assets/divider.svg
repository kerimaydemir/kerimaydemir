<svg width="1200" height="64" viewBox="0 0 1200 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated section divider">
  <style>
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 2.8s ease forwards; }
    .spark { animation: travel 5.8s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes travel {
      0%, 14% { transform: translateX(70px); opacity: 0; }
      28% { opacity: 1; }
      76% { opacity: 1; }
      100% { transform: translateX(1058px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="72" y1="32" x2="1128" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFA46A" stop-opacity="0"/>
      <stop offset=".2" stop-color="#BFA46A"/>
      <stop offset=".5" stop-color="#F4E7C5"/>
      <stop offset=".8" stop-color="#BFA46A"/>
      <stop offset="1" stop-color="#BFA46A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path class="line" d="M72 32H1128" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <circle class="spark" cx="0" cy="32" r="3.5" fill="#F4E7C5"/>
</svg>
